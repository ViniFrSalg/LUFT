board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
lib_deps = 
	adafruit/Adafruit BME680 Library @ ^2.0.6
	boschsensortec/bsec2@^1.10.2610
	boschsensortec/BSEC Software Library@^1.8.1492
	boschsensortec/BME68x Sensor library@^1.3.40408
